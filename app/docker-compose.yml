services:
  api:
    build:
      context: ..
      dockerfile: ./app/Dockerfile

    container_name: stockflow_api

    ports:
      - "8000:8000"

    env_file:
      - ../.env

    depends_on:
      test-db:
        condition: service_healthy

  test-db:
    image: postgres:16-alpine

    container_name: stockflow_test_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stockflow_test

    ports:
      - "5433:5432"

    volumes:
      - stockflow_test_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stockflow_test_data: